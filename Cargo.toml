[package]
name = "memoni"
version = "1.2.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", default-features = false }
anyhow = "1.0.99"
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies"] }
bincode = { version = "2.0.1", features = ["serde"] }
dirs = "6.0.0"
egui = { version = "0.37.0", default-features = false, features = ["serde"] }
egui_glow = { version = "0.37.0", default-features = false, features = ["x11"] }
egui_system_font_provider = "0.37.0"
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
env_logger = "0.11.8"
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen", "std", "system"] }
freedesktop-icon = "0.0.3"
frizbee = "0.13.0"
futures-lite = "2.6.1"
gethostname = "1.1.0"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "x11"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif"] }
indexmap = "2.14.2"
itertools = "0.15.0"
lexopt = "0.3.1"
libloading = "0.9.0"
log = "0.4.28"
make_optional = { path = "make_optional" }
md-5 = "0.10.6"
mime = "0.3.17"
mio = "1.0.4"
raw-window-handle = "0.6.2"
regex = "1.13.1"
resvg = { version = "0.47.0", default-features = false }
rustix = { version = "1.1.2", default-features = false, features = ["process", "time"] }
self_cell = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.14.0"
signal-hook = "0.3.18"
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
toml = "0.9.5"
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "randr", "xfixes", "xtest", "cursor"] }
xdg-mime = "0.4.0"
xim = { version = "0.5.0", features = ["x11rb-client", "x11rb-xcb"] }
xkeysym = "0.2.1"
zbus = "5.19.0"
