[package]
name = "memoni"
version = "1.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", default-features = false }
anyhow = "1.0.99"
bincode = {version = "2.0.1", features = ["serde"] }
dirs = "6.0.0"
egui = { version = "0.36.1", default-features = false, features = ["serde"] }
egui_glow = { version = "0.36.1", default-features = false, features = ["x11"] }
env_logger = "0.11.8"
fontconfig = "0.10.0"
freedesktop-icon = "0.0.3"
gethostname = "1.1.0"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "x11"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif"] }
lexopt = "0.3.1"
libloading = "0.9.0"
log = "0.4.28"
make_optional = { path = "make_optional" }
md-5 = "0.10.6"
mime = "0.3.17"
mio = "1.0.4"
raw-window-handle = "0.6.2"
regex = "1.13.1"
resvg = { version = "0.47.0", default-features = false }
rustix = { version = "1.1.2", default-features = false, features = ["process", "time"] }
self_cell = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.14.0"
signal-hook = "0.3.18"
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"] }
toml = "0.9.5"
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "randr", "xfixes", "xtest"] }
xdg-mime = "0.4.0"
xkeysym = "0.2.1"
