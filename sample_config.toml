# Maximum items kept in history
#
# default: 100
item_limit = 50

# Draws a colored ribbon on the top-right corner of the window
# Intended to distinguish CLIPBOARD and PRIMARY windows
#
# default: false
show_ribbon = true

# Hides the scroll bar when the mouse is not hovering over the item list
#
# default: false
scroll_bar_auto_hide = true

# Allows dragging the item list with the pointer to scroll
#
# default: false
drag_scroll = true

# Minimum gap (px) kept between the active item and the item list edges while
# navigating with the keyboard (vim's "scrolloff")
#
# default: 0
scroll_off = 100

# Shows quick paste keyboard shortcut hints on buttons
#
# default: true
show_quick_paste_hint = true

# Window positioning mode
#
# List of window positioning strategies tried in sequence. Each strategy is used if it
# can produce a valid position, otherwise the next one is tried. If no strategies is
# usable, `"monitor"` will be used as fallback.
#
# Available strategies:
#   "monitor"        - Center in the focused monitor
#   "pointer"        - Follow the mouse pointer
#   "active_pointer" - Follow pointer if it's visible and in the focused monitor
#   "text_caret"     - Follow text caret of the currently focused input field
#
# Example:
# - `["active_pointer", "monitor"]` follows the pointer when possible,
#   otherwise centers in the focused monitor.
# - `["text_caret", "monitor"]` follows the text caret if there's a focused input field,
#   otherwise centers in the focused monitor.
#
# default: CLIPBOARD - ["monitor"], PRIMARY - ["pointer"]
window_position_mode = ["text_caret", "monitor"]

# Window classes that need middle-click paste delay
#
# Some windows (e.g., Firefox) don't receive paste event if memoni middle-clickes immediately
# after memoni window closes. For these, we can make memoni wait a moment before clicking.
#
# Each string is a regex matched against the instance/class names of the window under the pointer.
#
# default: ["^[Ff]irefox"]
middle_click_delay_windows = ["^[Ff]irefox"]

# Command to run when the IME switch keymap is pressed
#
# Since memoni grabs all keyboard input while shown, the normal IME hotkey cannot be
# used inside memoni. Use this to forward an IME switch command instead.
#
# The command is run through "sh -c". Example for ibus:
# """
#   engines=$(gsettings get org.freedesktop.ibus.general preload-engines | tr -d "[]',")
#   current=$(ibus engine)
#
#   first_engine=""
#   next_engine=""
#   found_current=0
#   for engine in $engines; do
#       if [ -z "$first_engine" ]; then
#           first_engine="$engine"
#       fi
#
#       if [ "$found_current" -eq 1 ]; then
#           next_engine="$engine"
#           break
#       fi
#
#       if [ "$engine" = "$current" ]; then
#           found_current=1
#       fi
#   done
#
#   if [ -z "$next_engine" ]; then
#       next_engine="$first_engine"
#   fi
#
#   ibus engine "$next_engine"
# """
#
# default: unset
switch_ime_command = "ibus engine xkb:us::eng"


# Application-specific paste keymaps for CLIPBOARD selection
#
# Map window instance/class names to one or more key strokes.
# Each key stroke uses a character key (e.g., 'v') or number (keysym code), plus modifier.
#
# default: { key = 'v', modifier = "Control" } for all applications
[app_paste_keymaps]

# Single key stroke form
Alacritty = { key = 'v', modifier = ["Control", "Shift"] }

# Multiple key strokes will be pressed in sequence
Emacs = [
  { key = 'c', modifier = "Control" },
  { key = 'y' }
]


# Layout and spacing
[layout]

# Window dimensions (px)
#
# default: { width = 400, height = 550 }
window_dimensions = { width = 300, height = 700 }

# Window content padding (px)
#
# default: { x = 8, y = 8 }
window_padding = { x = 4, y = 4 }

# Padding (px) around each button
#
# default: { x = 8, y = 8 }
button_padding = { x = 5, y = 5 }

# Padding (px) around buttons with preview thumbnail
#
# default: { x = 5, y = 5 }
button_with_preview_padding = { x = 4, y = 4 }

# Radius (px) for button corners
#
# default: 6
button_corner_radius = 3

# Spacing (px) between buttons
#
# default: 5
button_spacing = 4

# Scroll bar margin (px) from window top and bottom edges
#
# default: 8
scroll_bar_margin = 0

# Margin (px) between mouse pointer and window when positioning near pointer
#
# default: 5
pointer_gap = 2

# Like `pointer_gap`, but used when the placement is clamped to the screen edges
# (e.g. pointer near a screen side/corner). Useful when a small `pointer_gap` is
# wanted for the open placement but looks cramped when the window is pinned at
# the screen edge.
#
# default: 5
clamped_pointer_gap = 8

# Minimum distance (px) from screen edges when positioning the window
#
# default: 10
screen_edge_gap = 8

# Size (px) of the preview thumbnail
#
# default: { width = 105, height = 70 }
preview_size = { width = 40, height = 40 }

# Ribbon thickness (px) when show_ribbon = true
#
# default: 70
ribbon_size = 150

# Pending keys overlay is an overlay that shown when waiting for a sequenced keymap (e.g., dd, gg)
# to complete.
#
# Padding (px) around the text inside the pending keys overlay
#
# default: { x = 8, y = 6 }
pending_keys_padding = { x = 4, y = 4 }

# Margin (px) between the pending keys overlay and window edges
#
# default: { x = 8, y = 8 }
pending_keys_margin = { x = 10, y = 10 }

# Corner radius (px) of the pending keys overlay background
#
# default: 5
pending_keys_corner_radius = 2

# Size (px) of the pinned item indicator
#
# default: 4
pin_size = 2

# Size (px) of the bookmarked item indicator
#
# default: { x = 5, y = 7 }
bookmark_size = { x = 6, y = 10 }

# Shows a small preview square for color values on buttons
#
# Supported formats:
#   #RGB, #RGBA, #RRGGBB, #RRGGBBAA
#   rgb(r, g, b), rgba(r, g, b, a)
#   hsl(h, s%, l%), hsla(h, s%, l%, a)
#
# default: true
show_color_preview = false

# Size (px) of the color preview square
#
# default: 18
color_preview_size = 12

# Corner radius (px) of the color preview square
#
# default: 4
color_preview_corner_radius = 6


# Font configuration
[font]

# Font families to use, in priority order
#
# Multiple fonts can be specified, where subsequent entries act as fallbacks if earlier ones
# do not contain the required glyphs (e.g., for emojis or specific languages).
#
# Each entry must be one of:
#
# - A real font family name installed on the system (as reported by e.g., `fc-list`).
#
# - A generic family alias:
#     "sans-serif", "serif", "monospace", "emoji", "system-ui", "cursive", "fantasy", "math"
#   Generic aliases resolve through the system font configuration, so a user fonts.conf like:
#     <alias>
#         <family>sans-serif</family>
#         <prefer>
#             <family>Noto Sans</family>
#             <family>Noto Color Emoji</family>
#         </prefer>
#     </alias>
#   controls which fonts they pick.
#
# - The bundled Noto fonts:
#     "memoni:noto-sans"      - Noto Sans (regular Latin font)
#     "memoni:noto-sans-math" - Noto Sans Math (for the newline symbol (↵) and the tab symbol (⇥))
#
# - "system-fallback": the system's font configuration is consulted on demand to pick a font
#   for each unsupported character.
#
# Example:
# - ["JetBrains Mono", "memoni:noto-sans-math", "system-fallback"] uses JetBrains Mono as
#   the primary font, then the bundled math font for math glyphs that it lacks, and
#   finally any system font.
# - ["Noto Sans"] uses only that font; characters it lacks will not fall back to any
#   system font and will be rendered as tofu boxes instead.
#
# default: ["sans-serif", "system-fallback", "memoni:noto-sans", "memoni:noto-sans-math"]
families = ["DejaVu Sans", "Noto Color Emoji", "memoni:noto-sans-math", "JetBrainsMonoNL Nerd Font", "system-fallback"]

# Primary text size (pt)
#
# default: 13
size = 12.5

# Secondary text size (pt) (e.g., metadata)
#
# default: 11
secondary_size = 8

# Additional y offset applied to text layout
#
# This can be a single number (applied to the first font in 'families')
# or an array of numbers, where each value corresponds to the y-offset for the font at the
# matching index in the 'families' array.
# For example, `y_offset_factor = [0.1, 0.0, -0.05]` would apply 0.1 to the first font,
# 0.0 to the second, and -0.05 to the third.
#
# default: 0 for all fonts
y_offset_factor = -0.05

# Moves text underline up/down (px)
#
# default: 0
underline_offset = -2

# Font size (pt) for the overlay texts (pending keys, error)
#
# default: 16
overlay_text_size = 14


# Colors (hex; can be #RRGGBB or #RRGGBBAA)
[theme]

# Window background
#
# default: "#191919"
background = "#2e313dbf"

# Primary text color
#
# default: "#cccccc"
foreground = "#eeeeee"

# Secondary text color
#
# default: "#919191"
secondary_foreground = "#b0b0b0"

# Muted text color
#
# default: "#bfbfbf60"
muted_foreground = "#707070"

# Button background
#
# default: "#2f2f2f"
button_background = "#404552bf"

# Active/pressed button background
#
# default: "#454545"
button_active_background = "#446688"

# Scroll bar track background
#
# default: "#0a0a0a"
scroll_background = "#1f1f23"

# Scroll bar handle color
#
# default: "#bbbbbb"
scroll_handle = "#dddddd"

# Preview pane background
#
# default: "#22222277"
preview_background = "#434856bf"

# Ribbon color
#
# default: CLIPBOARD - "#0000ff55", PRIMARY - "ff000030"
ribbon = "#48b0bd84"

# Pending keys overlay text color
#
# default: "#cccccc"
pending_keys_foreground = "#ffffff"

# Pending keys overlay background color
#
# default: "#000000a0"
pending_keys_background = "#2e313ddd"

# Error message overlay text color
#
# default: "#f87171"
error_foreground = "#e57373"

# Error message overlay background color
#
# default: "#450a0add"
error_background = "#800000a0"

# Success message overlay text color
#
# default: "#8ddb8d"
success_foreground = "#90f5ad"

# Success message overlay background color
#
# default: "#0a450add"
success_background = "#022111a0"

# Pinned item indicator color
#
# default: "#cccccc"
pin_color = "#ffffff"

# Search input caret (cursor) color
#
# default: "#c0deff"
search_caret = "#ffffff"

# Search input text selection highlight color
#
# default: "#005c80"
search_selection = "#446688aa"

# Search mode indicator text color
#
# default: plain mode - "#909090", fuzzy mode - "#db6e67", regex mode - "#6e8bff"
search_mode = {
    plain = "#ff0000",
    fuzzy = "#00ff00",
    regex = "#0000ff",
}

# Search match highlight color in items
#
# default: "#d48e4c60"
search_match = "#00a5ff80"

# Bookmark ribbon color shown while the bookmark view is active
#
# default: "#b6150b55"
bookmark_ribbon = "#7c15d6ab"

# Bookmarked item indicator color
#
# default: "#ca190c"
bookmark_color = "#a44bf1"


# Selection-specific overrides
# Any field can be overridden under [CLIPBOARD] or [PRIMARY]

[CLIPBOARD]

# Shows ribbon only on PRIMARY window
show_ribbon = false

# CLIPBOARD selection theme overrides
[CLIPBOARD.theme]
button_active_background = "#912caf"
scroll_background = "#00000000"
preview_background = "#00000000"

[PRIMARY]

# Keeps more items when using PRIMARY
item_limit = 120
